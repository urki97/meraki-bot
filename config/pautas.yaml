# Pautas de contenido para Meraki Bar & Cocktails
# Estas pautas guían al planner y al copy agent

bar:
  nombre: "Meraki Bar & Cocktails"
  slogan: "Hacer algo con amor y creatividad poniendo el alma en ello"
  instagram: "@merakibilbao"
  direccion: "Calle Santo Rosario 1, Santutxu, Bilbao"
  especialidad: "cócteles de autor y pintxos"
  ambiente: "moderno, cercano, elegante"
  seguidores: 458 # cuenta pequeña — tono cercano, no corporativo
  terraza: false

tono:
  idioma: español
  estilo: cercano y bilbaíno
  evitar:
    - lenguaje corporativo
    - frases hechas y clichés
    - exceso de emojis
    - inventar eventos o precios no confirmados
    - anglicismos innecesarios
  usar:
    - vocabulario cotidiano del País Vasco
    - referencias locales reales (Santutxu, Bilbao)
    - segunda persona del singular (tú)
    - frases cortas y directas

hashtags:
  fijos:
    - "#MerakiBilbao"
    - "#Santutxu"
  maximo_por_post: 3 # fijos + 1 variable
  nota: "naturales, no spam — integrados o al final del caption"

imagen:
  # Prompt base inspirado en el ambiente real del bar:
  # neón rojo, barra oscura, iluminación cálida ambar/rojo, cocktails con guarnición
  estilo_prompt_base: >
    cozy cocktail bar interior, red neon sign, warm amber and red lighting,
    dark wood bar counter, bottles on shelves in background, bokeh background,
    close-up cocktail with garnish, no text, no people, cinematic, photorealistic,
    high quality, editorial photography style
  overlay_alpha: 0.45
  texto_color: "white"
  resolucion: [1080, 1920] # story Instagram
  # Directorio de fotos reales del bar (si existen, se usan en lugar de SDXL)
  fotos_reales_dir: "assets/fotos_reales"

# ── Horario de apertura ───────────────────────────────────────────────────────
# El bot respeta este horario y no publica en días de cierre
apertura:
  dias_abierto: [miercoles, jueves, viernes, sabado, domingo]
  dias_cerrado: [lunes, martes]
  nota: "lunes y martes cerrado — no publicar"

# ── Publicación semanal rotatoria de eventos fijos ────────────────────────────
# En lugar de publicar todos los días de apertura, se publica UN evento fijo
# por semana rotando entre miércoles, jueves y viernes.
# Sábado y domingo se publican siempre (son los días de mayor tráfico).
publicacion_rotatoria:
  activa: true
  eventos_rotativos: [miercoles, jueves, viernes]  # rota en este orden semana a semana
  siempre_publicar: [sabado, domingo]              # estos se publican cada semana
  # La semana de rotación se determina por número de semana del año (% 3)
  # Semana %3 == 0 → miércoles, %3 == 1 → jueves, %3 == 2 → viernes

# ── Temáticas por día de la semana ───────────────────────────────────────────
dias:
  lunes:
    publicar: false
    motivo: "cerrado los lunes"

  martes:
    publicar: false
    motivo: "cerrado los martes"

  miercoles:
    publicar: true  # rotatorio — no siempre
    tema: "Miércoles de mojitos"
    enfoque: "promoción fija e inamovible — mojitos a precio especial"
    hashtag_variable: "#MiercolesDelMojito"
    prompt_imagen_extra: >
      mojito cocktail with fresh mint leaves, lime wedge, striped straw, strawberry garnish,
      tall glass, warm red neon bar background, dark counter, close-up bokeh
    promocion_fija: true

  jueves:
    publicar: true  # rotatorio — no siempre
    tema: "pintxopote"
    enfoque: "pintxo + zurito a precio especial — tradición vasca"
    hashtag_variable: "#Pintxopote"
    prompt_imagen_extra: >
      traditional basque pintxos on dark bar counter, small glass of beer zurito,
      warm cozy bar atmosphere, wooden counter, soft amber light

  viernes:
    publicar: true  # rotatorio — no siempre
    tema: "tortillas especiales"
    enfoque: "tortillas especiales del día — plato estrella del viernes"
    hashtag_variable: "#TortillaDelDia"
    prompt_imagen_extra: >
      spanish tortilla omelette slice on rustic plate, warm kitchen light,
      bar counter setting, cozy restaurant atmosphere, close-up food photography

  sabado:
    publicar: true  # siempre
    tema: "noche de cócteles"
    enfoque: "ambiente nocturno, cócteles de autor, noche en Bilbao"
    hashtag_variable: "#CoctelesDeAutor"
    prompt_imagen_extra: >
      signature cocktail close-up, dark moody bar at night, red neon reflections,
      elaborate garnish, dark wood bar counter, bokeh bottle wall, dramatic lighting

  domingo:
    publicar: true  # siempre
    tema: "vermú dominical"
    enfoque: "vermú, cierre de semana, relax y buena compañía"
    hashtag_variable: "#VermuDominical"
    prompt_imagen_extra: >
      vermouth glass with olive and orange slice, cozy bar afternoon light,
      warm amber tones, dark counter, relaxed sunday atmosphere, soft bokeh
